<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Камиля</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #ffd6ec);
    overflow: hidden;
}

/* БЛЕСТКИ */
.sparkle {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.sparkle span {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: sparkleMove 5s linear infinite;
}

@keyframes sparkleMove {
    from { transform: translateY(0); }
    to { transform: translateY(-100vh); }
}

/* КАРТОЧКА */
.card {
    width: 650px;
    margin: 60px auto;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    position: relative;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ЦВЕТЫ */
.flower {
    position: absolute;
    font-size: 45px;
    opacity: 0.7;
    animation: float 5s ease-in-out infinite;
}

.flower1 { top: 10px; left: 15px; }
.flower2 { bottom: 10px; right: 15px; }
.flower3 { top: 50%; right: -20px; }

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0); }
}

/* ШАПКА (кружево) */
.header {
    background: repeating-linear-gradient(
        45deg,
        #ffffff,
        #ffffff 8px,
        #ffe6f2 8px,
        #ffe6f2 16px
    );
    text-align: center;
    padding: 50px 20px;
    border-bottom: 2px solid #ffd6e7;
}

.header h1 {
    margin: 0;
    font-size: 36px;
    color: #d63384;
}

.header p {
    margin-top: 10px;
    font-size: 17px;
    color: #a61e4d;
}

/* КОНТЕНТ */
.content {
    padding: 30px;
}

.section {
    margin-bottom: 25px;
}

.section h2 {
    color: #d63384;
    border-bottom: 2px solid #ffd6e7;
    padding-bottom: 5px;
}

.section p {
    line-height: 1.6;
    color: #444;
}

/* ХОВЕР */
.card:hover {
    transform: scale(1.03);
    transition: 0.3s;
}

</style>
</head>

<body>

<!-- БЛЕСТКИ -->
<div class="sparkle">
    <span style="left:10%; animation-delay:0s;"></span>
    <span style="left:30%; animation-delay:1s;"></span>
    <span style="left:50%; animation-delay:2s;"></span>
    <span style="left:70%; animation-delay:3s;"></span>
    <span style="left:90%; animation-delay:4s;"></span>
</div>

<div class="card">

    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌸</div>
    <div class="flower flower3">🌺</div>

    <div class="header">
        <h1>Камиля</h1>
        <p>18 лет • Казань</p>
    </div>

    <div class="content">

        <div class="section">
            <h2>О себе</h2>
            <p>Студентка ПГУФКСиТ. Хочу развиваться в IT и работать по специальности.</p>
        </div>

        <div class="section">
            <h2>Навыки</h2>
            <p>MySQL</p>
        </div>

        <div class="section">
            <h2>Образование</h2>
            <p>ПГУФКСиТ</p>
        </div>

        <div class="section">
            <h2>Хобби</h2>
            <p>Танцы, фортепиано, спортивный туризм</p>
        </div>

    </div>

</div>

</body>
</html>
